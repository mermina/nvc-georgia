# Pages CMS configuration — https://pagescms.org/docs/configuration/
media:
- name: images
  label: Photos
  input: img
  output: img
  categories:
  - image
- name: files
  label: Documents
  input: files
  output: files
  categories:
  - document
  - image
  - spreadsheet
content:
- name: home
  label: Home page
  type: file
  path: src/_data/home.json
  fields:
  - name: hero
    label: Top of the page
    type: object
    fields:
    - name: eyebrow
      label: Small line above the headline
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: title_line_1
      label: Headline – line 1
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: title_line_2
      label: Headline – line 2
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: lead
      label: Intro text
      type: object
      fields:
      - {name: en, label: English, type: text}
      - {name: ka, label: ქართული (Georgian), type: text}
    - name: button_contact
      label: 'Button: contact'
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: button_about
      label: 'Button: about NVC'
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: photo
      label: Photo
      type: image
      options: {media: images}
    - {name: photo_alt, label: Photo description (for screen readers), type: string}
  - name: about
    label: About NVC
    type: object
    fields:
    - name: kicker
      label: Small label
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: heading
      label: Heading
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: text_left
      label: Text – left column
      type: object
      fields:
      - {name: en, label: English, type: text}
      - {name: ka, label: ქართული (Georgian), type: text}
    - name: text_right
      label: Text – right column
      type: object
      fields:
      - {name: en, label: English, type: text}
      - {name: ka, label: ქართული (Georgian), type: text}
    - name: link_text
      label: Link text
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - {name: link_url, label: Link address, type: string, description: Leave empty to hide the link}
    - name: materials_button
      label: Big button to Materials
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
  - name: who
    label: Who we are
    type: object
    fields:
    - name: photo
      label: Group photo
      type: image
      options: {media: images}
    - {name: photo_alt, label: Photo description, type: string}
    - name: kicker
      label: Small label
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: heading
      label: Heading
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: text
      label: Text
      type: object
      fields:
      - {name: en, label: English, type: text}
      - {name: ka, label: ქართული (Georgian), type: text}
    - name: card_kicker
      label: Team card – small label
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: card_title
      label: Team card – title
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: card_link
      label: Team card – link text
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
  - name: news_heading
    label: Heading of the What's New section
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
- name: team
  label: Team
  type: collection
  path: src/content/team
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{hour}{minute}{second}.md'
  view:
    primary: name.en
    fields:
    - name.en
    - order
    sort:
    - order
  fields:
  - name: name
    label: Name
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - {name: order, label: Order (1 = shown first), type: number, description: '1, 2, 3 … To put something in between, use e.g. 2.5'}
  - name: photo
    label: Photo
    type: image
    description: Portrait, ideally at least 800 px wide
    options: {media: images}
  - name: role
    label: Role / titles
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: intro
    label: Short intro (first paragraph)
    type: object
    fields:
    - {name: en, label: English, type: text}
    - {name: ka, label: ქართული (Georgian), type: text}
  - name: bio
    label: Rest of the bio
    type: object
    fields:
    - {name: en, label: English, type: text}
    - {name: ka, label: ქართული (Georgian), type: text}
  - name: links
    label: Personal website / profile links (shown as buttons)
    type: object
    list: true
    fields:
    - name: label
      label: Button text
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - {name: url, label: 'Link (https://…)', type: string}
- name: materials_page
  label: Materials page – texts
  type: file
  path: src/_data/materials_page.json
  fields:
  - name: heading
    label: Page heading
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: banner
    label: Banner photo (optional – leave empty for the plain header)
    type: image
    options: {media: images}
  - {name: banner_alt, label: Banner description, type: string}
  - name: intro
    label: Intro line
    type: object
    fields:
    - {name: en, label: English, type: text}
    - {name: ka, label: ქართული (Georgian), type: text}
  - name: practice
    label: 'Section 1: Practice'
    type: object
    fields:
    - name: heading
      label: Section name
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: subtitle
      label: Subtitle
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: image
      label: Section photo
      type: image
      options: {media: images}
    - {name: image_alt, label: Photo description, type: string}
  - name: learn
    label: 'Section 2: Learn more'
    type: object
    fields:
    - name: heading
      label: Section name
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: subtitle
      label: Subtitle
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - name: image
      label: Section photo
      type: image
      options: {media: images}
    - {name: image_alt, label: Photo description, type: string}
  - name: coming_soon
    label: Text for items not ready yet
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
- name: materials
  label: Materials
  type: collection
  path: src/content/materials
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{hour}{minute}{second}.md'
  view:
    primary: title.en
    fields:
    - title.en
    - section
    - status
    - order
    sort:
    - order
  fields:
  - name: title
    label: Title
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: section
    label: Section
    type: select
    options:
      values:
      - {name: practice, label: Practice – tools and exercises}
      - {name: learn, label: Learn more and dive deeper}
  - name: status
    label: Status
    type: select
    options:
      values:
      - {name: available, label: Available}
      - {name: coming_soon, label: Coming soon}
  - {name: order, label: Order (1 = shown first), type: number, description: 'Order within its section: 1, 2, 3 … (use e.g. 2.5 to put something in between)'}
  - name: type
    label: Type label (e.g. Cards, Worksheet, Article)
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: description
    label: Short description
    type: object
    fields:
    - {name: en, label: English, type: text}
    - {name: ka, label: ქართული (Georgian), type: text}
  - {name: credit, label: Credit / source line, type: string, description: e.g. Adapted from … · © Author}
  - name: cover
    label: Cover image (optional)
    type: image
    options: {media: images}
  - name: links
    label: 'Buttons: files / links (the first one is the main button)'
    type: object
    list: true
    fields:
    - name: label
      label: Button text
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
      description: e.g. English, ქართული, Open PDF
    - {name: url, label: 'Link (https://…)', type: string, description: e.g. a Google Drive link. Fill in this OR upload a file below.}
    - name: file
      label: Or upload a file
      type: file
      description: 'PDF, Word or image. Large files (over ~10 MB): better use a Drive link.'
      options: {media: files}
    - name: use
      label: Which one should the button open?
      type: select
      options:
        placeholder: Automatic
        values:
        - {name: auto, label: Automatic}
        - {name: link, label: The link}
        - {name: file, label: The uploaded file}
      description: 'Leave on Automatic: the uploaded file is used if there is one, otherwise the link.'
- name: news
  label: What's New
  type: collection
  path: src/content/news
  format: yaml-frontmatter
  filename: '{year}-{month}-{day}-{hour}{minute}{second}.md'
  view:
    primary: title.en
    fields:
    - title.en
    - when.en
    - order
    sort:
    - order
  fields:
  - name: title
    label: Title
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - {name: order, label: Order (1 = shown first), type: number, description: '1, 2, 3 … To put something in between, use e.g. 2.5'}
  - {name: example, label: Example placeholder (shows an 'Example' badge), type: boolean}
  - name: kind
    label: Type (e.g. Invitation, News, Article)
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: when
    label: Date / when
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: image
    label: Picture (optional)
    type: image
    description: Your own picture for the card, e.g. a photo or poster
    options: {media: images}
  - {name: link, label: Link (optional), type: string, description: 'Website, registration form, Instagram post …'}
  - name: document
    label: Document (optional)
    type: file
    description: Upload a PDF or a poster file
    options: {media: files}
  - name: picture_choice
    label: Picture shown on the card
    type: select
    options:
      placeholder: Automatic
      values:
      - {name: auto, label: Automatic}
      - {name: picture, label: My uploaded picture}
      - {name: document, label: The uploaded document (if it is an image)}
      - {name: preview, label: Preview picture of the link}
      - {name: none, label: No picture (plain coloured card)}
    description: 'Automatic: your picture → else the document if it is an image → else the link''s preview picture → else plain.'
  - name: click_choice
    label: Clicking the card opens
    type: select
    options:
      placeholder: Automatic
      values:
      - {name: auto, label: Automatic}
      - {name: link, label: The link}
      - {name: document, label: The uploaded document}
      - {name: picture, label: The picture at full size}
      - {name: none, label: Nothing (card is not clickable)}
    description: 'Automatic: the link → else the document → else the picture.'
- name: site
  label: Site settings
  type: file
  path: src/_data/site.json
  fields:
  - {name: name, label: Site name, type: string}
  - name: contact
    label: Contact line in the footer
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: draft_notice
    label: Draft notice (bottom-left)
    type: object
    fields:
    - {name: show, label: Show the notice, type: boolean}
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
  - name: menu
    label: Menu
    type: object
    list: true
    fields:
    - name: label
      label: Menu item
      type: object
      fields:
      - {name: en, label: English, type: string}
      - {name: ka, label: ქართული (Georgian), type: string}
    - {name: url, label: Link, type: string}
- name: team_page
  label: Team page – texts
  type: file
  path: src/_data/team_page.json
  fields:
  - name: heading
    label: Page heading
    type: object
    fields:
    - {name: en, label: English, type: string}
    - {name: ka, label: ქართული (Georgian), type: string}
